# Stage 1 resume extraction pipeline configuration

docling:
  # "cuda" / "mps" / "auto" — passed straight into AcceleratorOptions(device=...)
  device: cuda
  num_threads: 8
  do_ocr: true

# Local OpenAI-compatible llama.cpp servers.
models:
  extraction:
    base_url: http://127.0.0.1:8080/v1
    model: local            # Gemma — field extraction and JD parsing
    timeout_seconds: 120
    max_retries: 1          # one retry on invalid JSON, then give up
    temperature: 0.0

  interpretation:
    base_url: http://127.0.0.1:8083/v1
    model: local            # Qwen — value interpretation, no arithmetic
    timeout_seconds: 60
    max_retries: 1
    temperature: 0.0
    batch_size: 20          # hard cap per spec

paths:
  output_dir: extracted
  report_path: parse_quality_report.md

# Fields whose raw_value should be sent to the interpreter model for
# scale disambiguation (e.g. "8.4" could be cgpa_10 or gpa_4).
interpret_fields:
  - cgpa
